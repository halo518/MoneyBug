spring.application.name=MoneyBug

# ==========================================
# MySQL DB ?? ??
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/moneybug?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234

# ==========================================
# JPA(Hibernate) ??
# ==========================================
# update: Entity ???? DB ???? ???? ????? ???????.
spring.jpa.hibernate.ddl-auto=update

# ?? ?? JPA? ???? SQL ???? ?? ?? ??? ?? ?????.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JPA 쿼리 파라미터(?)에 들어가는 실제 값을 콘솔에 출력합니다.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# Kakao / JWT (values come from environment variables)
# ==========================================
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}
kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
# optional: if set, mobile tokens issued for other Kakao apps are rejected
kakao.app-id=${KAKAO_APP_ID:}

# HS256 secret, at least 32 bytes
jwt.secret=${JWT_SECRET}
jwt.access-ttl-seconds=1800
jwt.refresh-ttl-seconds=1209600

# ==========================================
# Dev login bypass (LOCAL ONLY)
# true 이면 카카오 토큰 "test_token" 이 카카오 인증 없이 테스트 사용자로 로그인된다.
# 로컬 개발 편의를 위해 기본값은 켜짐(true). 운영 환경에서는 반드시 DEV_LOGIN_ENABLED=false 로 끌 것.
# ==========================================
auth.dev-login.enabled=${DEV_LOGIN_ENABLED:true}

# ==========================================
# Swagger (springdoc)
# 우리 DTO 는 StoreDto.Request / ContractDto.Request 처럼 중첩 클래스 이름이 같아서, 기본 설정이면 스키마 이름이
# 모두 "Request" 로 합쳐져 서로 덮어쓴다(매장 생성에 계약서 필드가 보이던 원인). 전체 클래스 이름으로 구분한다.
# ==========================================
springdoc.use-fqn=true
