# application-secret.yml 템플릿.
# 사용법: 이 파일을 같은 폴더에 application-secret.yml 로 복사한 뒤 실제 값으로 바꾼다.
#   (PowerShell) Copy-Item src/main/resources/application-secret.sample.yml src/main/resources/application-secret.yml
# application-secret.yml 은 .gitignore 대상이라 깃허브에 올라가지 않는다.
# 환경변수가 설정돼 있으면 환경변수 값이 우선한다 (${ENV_VAR:기본값}).

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/moneybug?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:your-db-username}
    password: ${DB_PASSWORD:your-db-password}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:your-kakao-rest-api-key}
  client-secret: ${KAKAO_CLIENT_SECRET:your-kakao-client-secret}

jwt:
  # HS256 시크릿, 반드시 32바이트 이상의 랜덤 문자열로 바꿀 것
  secret: ${JWT_SECRET:change-me-to-a-random-string-of-at-least-32-bytes}
