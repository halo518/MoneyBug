spring:
  application:
    name: MoneyBug

  # 민감한 값(DB 접속 정보, JWT 시크릿, 카카오 키)은 application-secret.yml 에서 읽어온다.
  # application-secret.yml 은 .gitignore 대상이므로, 처음 받았다면
  # application-secret.sample.yml 을 복사해서 application-secret.yml 을 만들고 실제 값을 채울 것.
  profiles:
    include: secret

  # ==========================================
  # MySQL DB (url / username / password 는 application-secret.yml)
  # ==========================================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 동시 요청이 많을 때 늘린다. MySQL max_connections(기본 151) 안에서.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # MySQL 기본 REPEATABLE READ 는 먼저 읽은 스냅샷 때문에 잠근 뒤 확인(check-then-act)이 옛 값을 본다.
      transaction-isolation: TRANSACTION_READ_COMMITTED

  # ==========================================
  # JPA (Hibernate)
  # ==========================================
  # 보건증 사진(카메라 원본)은 기본 1MB 를 넘는다.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    hibernate:
      # update: Entity 클래스 기준으로 DB 테이블을 자동 생성/수정한다.
      ddl-auto: update
    # 화면 응답까지 지연 로딩을 허용한다(기존 코드가 기댄다). 대신 아래 handling_mode 로 트랜잭션이 끝나면 커넥션을 돌려준다.
    open-in-view: true
    # 실행되는 SQL 을 콘솔에 출력한다. 기본은 끔. 로컬 디버깅: SHOW_SQL=true
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        # 기본(DELAYED_ACQUISITION_AND_HOLD)은 OSIV 가 요청 끝까지 커넥션을 쥔다. 롱 폴링(/me/changes, 최대 25초)이
        # 그동안 풀을 다 잡아 API 전체가 멈췄다(QA 2026-11-17 #21). 트랜잭션이 끝나면 풀에 돌려준다.
        connection:
          handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  # 실수(10320.5)를 정수 필드에 넣으면 소수를 버리지 않고 400.
  jackson:
    deserialization:
      accept-float-as-int: false

logging:
  level:
    # JPA 쿼리 파라미터(?) 실제 값 출력 (개인정보가 로그에 남으므로 기본은 끔). 로컬 디버깅: SQL_BIND_LOG=TRACE
    org.hibernate.orm.jdbc.bind: ${SQL_BIND_LOG:INFO}

# ==========================================
# Kakao (rest-api-key / client-secret 는 application-secret.yml)
# ==========================================
kakao:
  redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/auth/kakao/callback}
  # 선택: 설정하면 다른 카카오 앱에서 발급된 모바일 토큰을 거부한다.
  app-id: ${KAKAO_APP_ID:}

# 웹 카카오 로그인 후 브라우저를 돌려보낼 Flutter 웹앱 주소 (끝의 / 는 제거됨)
app:
  frontend-url: ${FRONTEND_URL:http://localhost:3004}
  # 자체 LLM (Ollama 호환 서버): 근무표 AI 브리핑 + AI 노무 도우미. 키는 비워도 된다.
  # base-url 이 비면 노무 도우미 질문은 AI_DISABLED(503), 노무 점검은 규칙 결과만(aiUsed=false).
  llm:
    base-url: ${LLM_BASE_URL:https://ai.ruraeru.xyz}
    model: ${LLM_MODEL:qwen3.5:9b}
    api-key: ${LLM_API_KEY:}

# ==========================================
# CORS: Flutter 웹 origin (쉼표로 여러 개, 패턴 허용). 운영에서는 실제 웹 주소로 바꿀 것.
# ==========================================
cors:
  allowed-origins: ${FRONTEND_ORIGIN:http://localhost:*,http://127.0.0.1:*}

# ==========================================
# JWT (secret 은 application-secret.yml)
# ==========================================
jwt:
  access-ttl-seconds: 1800
  refresh-ttl-seconds: 1209600

# ==========================================
# Dev login bypass (LOCAL ONLY)
# true 이면 카카오 토큰 "test_token" 이 카카오 인증 없이 테스트 사용자로 로그인된다.
# 기본값은 꺼짐(false). 로컬 개발에서 쓰려면 DEV_LOGIN_ENABLED=true 로 켠다.
# ==========================================
auth:
  dev-login:
    enabled: ${DEV_LOGIN_ENABLED:false}
  # 운영 테스트 계정: 이 비밀 토큰(16자 이상)을 카카오 토큰 자리에 보내면 "테스트알바" 로 로그인. 비우면 꺼짐.
  test-login:
    token: ${TEST_LOGIN_TOKEN:}

# ==========================================
# Swagger (springdoc)
# 우리 DTO 는 StoreDto.Request / ContractDto.Request 처럼 중첩 클래스 이름이 같아서, 기본 설정이면 스키마 이름이
# 모두 "Request" 로 합쳐져 서로 덮어쓴다(매장 생성에 계약서 필드가 보이던 원인). 전체 클래스 이름으로 구분한다.
# ==========================================
# 기본은 꺼짐. 켜려면 SWAGGER_ENABLED=true (SecurityConfig 도 같은 값을 본다).
springdoc:
  use-fqn: true
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
